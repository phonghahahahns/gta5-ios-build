name: Build GTAV Community IPA
on: workflow_dispatch

jobs:
  build:
    # Bắt buộc: macOS 14+ trên Apple Silicon (runner mặc định có thể là Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 1. Chọn đúng phiên bản Xcode (dự án yêu cầu 26+)
      - name: Select Xcode
        run: |
          # Liệt kê các Xcode có sẵn trên runner
          ls /Applications | grep Xcode
          # Chọn Xcode 26 nếu có (tên có thể là Xcode_26.0.app hoặc Xcode_26.1.app)
          sudo xcode-select -s /Applications/Xcode_26.0.app  # Điều chỉnh theo tên thực tế
          xcodebuild -version

      # 2. Cài đặt Rust toolchain 1.98.1 với target iOS
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1
          source $HOME/.cargo/env
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      # 3. Cài đặt XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen

      # 4. Tải hoặc chuẩn bị file game.wasm (nếu cần)
      # Dự án yêu cầu game.zip chứa game.wasm và shaders
      # Nếu bạn có sẵn file, hãy đặt trong repo hoặc tải từ artifact/secret
      - name: Prepare Game Files
        run: |
          # Ví dụ: tải game.wasm từ một URL bí mật
          # curl -L -o game.zip ${{ secrets.GAME_ZIP_URL }}
          ls -la

      # 5. Build IPA
      - name: Build IPA
        run: |
          chmod +x make-ios.sh
          # Sử dụng script chính thức của dự án
          ./make-ios.sh game.zip --ipa

      # 6. Tải lên IPA (tùy chọn)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-IPA
          path: "*.ipa"
